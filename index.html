<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Tracker</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Tracker</h1>

    <main class="container ">
        <div class="row">
            <div class="col">
                <form id="postSelection">
                    <select name="postSelect" id="postSelect">
                        <option>Select a Post</option>
                        <option value="newPost">Create New Post</option>
                    </select>
                </form>

                <div id="postDisplay" class="d-none">
                    <h3>Title</h3>
                    <img src="">
                    <p>Body</p>
                </div>
                
                <form id="newPostForm" class="d-none p-5 bg-light border border-1 d-flex justify-content-center mb-5">
                    <div class="form-group">
                        <label for="newTitle" class="form-label"> Enter title</label>
                        <input type="text" name="newTitle" id="newTitle">
                    </div>
                    <div class="form-group">
                        <label for="newPic" class="form-label"> Upload picture</label>
                        <input type="text" name="newPic" id="newPic">
                    </div>
                    <div class="form-group">
                        <label for="newBody"> Enter post body</label>
                        <input type="text" name="newBody" id="newBody">
                    </div>
                    <input type="submit" value="newPost">
                </form>
            </div>

            <div class="col">
                <div id="trackers">
                    <div id="tracker1" class=" p-3 border-1 bg-light border border-1 mt-5 d-flex justify-content-between">
                        <div>
                            <h3>Subreddit</h3>
                            <p>Time remaining:</p>
                        </div>
                        <input type="button" value="reset">
                    </div>
                </div>

                <form id="addSub" class="p-3 bg-light border border-1 mt-3">
                    <label for="newSub">Name of new Subreddit</label>
                    <input type="text" name="newSub" id="newSub">

                    <label for="newLink">Link for new Subreddit</label>
                    <input type="text" name="newLink" id="newLink">

                    <label for="newTime">Time length for posts</label>
                    <input type="number" name="newTime" id="newTime">

                    <input type="submit" value="addSub">
                </form>
            </div>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
